server {
    listen 80;
    server_name localhost;

    # rashankidukan project root is /var/www/public
    root /var/www/public;
    index index.php index.html;

    charset utf-8;

    # Max upload size (installer downloads/uploads files)
    client_max_body_size 100M;

    # ═══ ENTERPRISE: Gzip compression for API responses ═══
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_vary on;

    # ═══ ENTERPRISE: Security headers ═══
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ═══ ENTERPRISE: Rate limiting zone for API ═══
    # (defined in http block, applied per-location below)

    # ── Main location ──────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Static files ───────────────────────────────────────
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ── 404 fallback ───────────────────────────────────────
    error_page 404 /index.php;

    # ── PHP-FPM ────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Timeouts for installer and BusyNotify bulk import (11k+ products)
        fastcgi_read_timeout 600;
        fastcgi_connect_timeout 600;
        fastcgi_send_timeout 600;

        # Buffer tuning
        fastcgi_buffer_size 128k;
        fastcgi_buffers 8 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # ── Block hidden files ─────────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # ── Installer assets (install wizard CSS/JS) ───────────
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ /index.php?$query_string;
    }
}
